server:
  port: 8083

spring:
  application:
    name: ms-matricula


  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/matricula_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

  instance:
    prefer-ip-address: true


springdoc:
  enable-hateoas: false