spring:
  application:
    name: ms-asistencia

  datasource:
    url: jdbc:mysql://localhost:3306/asistencia_db
    username: root
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

server:
  port: 8085