server:
  port: 8084

spring:
  application:
    name: ms-evaluaciones

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/evaluacion_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

  instance:
    prefer-ip-address: true