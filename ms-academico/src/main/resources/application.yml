server:
  port: 8082

spring:
  application:
    name: ms-academico

  datasource:
    url: jdbc:mysql://localhost:3306/academico_db
    username: root
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true